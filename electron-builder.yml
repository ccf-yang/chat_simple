appId: com.monkeycode.openai-chat
productName: OpenAI Chat
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asar: true
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
win:
  executableName: openai-chat
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: OpenAI Chat
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
linux:
  target:
    - AppImage
  category: Utility
